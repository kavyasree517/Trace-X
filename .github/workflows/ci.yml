name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Non-ASCII and pictographic character scan
        run: python scripts/check_characters.py

      - name: Copy deck prohibited phrase lint
        run: python scripts/lint_copy.py

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Backend linting (ruff)
        run: |
          cd backend
          ruff check .

      - name: Backend type checking (mypy)
        run: |
          cd backend
          mypy app

      - name: Frontend linting (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend type checking (tsc)
        run: |
          cd frontend
          npm run typecheck

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build frontend
        run: |
          cd frontend
          npm run build
