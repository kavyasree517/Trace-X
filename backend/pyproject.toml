[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracex-backend"
version = "0.1.0"
description = "Trust-aware Risk Analysis and Connection Evidence for Cryptocurrency Exchanges"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "networkx>=3.2.1",
    "scikit-learn>=1.4.1.post1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "joblib>=1.3.2",
    "reportlab>=4.1.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "eth-utils>=4.0.0",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "respx>=0.21.1",
    "hypothesis>=6.98.15",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "types-reportlab>=4.1.0.20240313",
    "pandas-stubs>=2.2.0.240218",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "eth_utils.*",
    "slowapi.*",
    "reportlab.*",
    "joblib.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
